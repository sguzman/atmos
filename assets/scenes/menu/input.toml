# Menu input configuration

[camera]
mode = "2d"
[camera.movement]
control = "mouse"
speed = 0.0
forward = ""
backward = ""
left = ""
right = ""

[camera.rotation]
degrees_per_second = 0.0
yaw_left = ""
yaw_right = ""
pitch_up = ""
pitch_down = ""

[[overlays]]
name = "menu"
toggle = ""

[[actions]]
name = "menu_play"
action = "actions/scene-transition.toml"
key = "Enter"

[[actions]]
name = "menu_quit"
action = "actions/quit.toml"
key = "Escape"
