# Scene composition for the main world. References entity templates in `entities/`.
startup_scene = "menu"

[camera]
name = "main_camera"
fov = 90.0
[camera.transform]
position = { x = 20.5, y = 4.5, z = 9.0 }
look_at = { x = -70.0, y = 200.0, z = 0.0 }
up = { x = 0.0, y = 1.0, z = 0.0 }

[bounds]
shape = "rectangle"
[bounds.x]
min = -300.0
max = 300.0
[bounds.y]
min = -100.0
max = 200.0
[bounds.z]
min = -300.0
max = 300.0

[gravity]
x = 0.0
y = -15
z = 0.0

[physics]
substeps = 4
solver_iterations = 20

[skybox]
color = "lightblue"

[sun]
time = 12.0
color = "white"
brightness = 5000.0
shadows = true
distance = 500.0
size = 30.0

[render]
hdr = false
tonemapping = "reinhard_luminance"

[render.bloom]
enabled = true
preset = "natural"
intensity = 0.15
low_frequency_boost = 0.7
low_frequency_boost_curvature = 0.95
high_pass_frequency = 1.0
composite_mode = "energy_conserving"
max_mip_dimension = 512
scale = { x = 1.0, y = 1.0 }
[render.bloom.prefilter]
threshold = 0.0
threshold_softness = 0.0

[render.dlss]
enabled = false
mode = "quality"
sharpness = 0.2

[render.ray_tracing]
enabled = false
mode = "quality"

[render.fog]
enabled = true
color = "white"
alpha = 1.0
directional_light_color = "white"
directional_light_alpha = 1.0
directional_light_exponent = 8.0
[render.fog.falloff]
kind = "linear"
start = 0.0
end = 100.0

[render.clouds]
enabled = false
raymarch_steps = 64
shadow_raymarch_steps = 12
planet_radius = 6371000.0
bottom_height = 1200.0
top_height = 2400.0
coverage = 0.55
density = 0.03
base_scale = 1.5
detail_scale = 40.0
detail_strength = 0.28
base_edge_softness = 0.12
bottom_softness = 0.22
shadow_step_size = 12.0
shadow_step_multiply = 1.25
forward_scattering_g = 0.8
backward_scattering_g = -0.2
scattering_lerp = 0.5
ambient_color_top = "#9AB0D0"
ambient_color_bottom = "#2A3E55"
min_transmittance = 0.1
render_resolution = { x = 1920.0, y = 1080.0 }
wind_velocity = { x = -1.2, y = 0.0, z = 2.1 }

[render.clouds.god_rays]
enabled = true
intensity = 0.6
decay = 0.95
exposure = 0.8
samples = 48


[[lights]]
kind = "point"
color = "white"
intensity = 1000000.0
shadows = true
range = 50.0
[lights.position]
x = 4.0
y = 8.0
z = 4.0
[lights.look_at]
x = 0.0
y = 0.5
z = 0.0

[[lights]]
kind = "ambient"
color = "white"
brightness = 100.0
