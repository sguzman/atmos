# Showcase 2: several foods force scored candidate selection.

[showcase]
name = "hungry_choice"
description = "Several foods compete on distance and nutrition. The debug panel shows which perceived candidate won and why."

[world]
floor_size = 24.0
floor_color = "#223438"

[camera.position]
x = 0.0
y = 12.0
z = 14.0

[camera.look_at]
x = 1.0
y = 0.0
z = 0.5

[agent]
perception_radius = 14.0

[agent.position]
x = -5.0
y = 0.8
z = 0.0

[agent.motion]
speed = 2.4
consume_distance = 0.6

[agent.decision]
hunger_weight = 1.0
nutrition_weight = 1.25
distance_weight = 0.55

[agent.hunger]
initial = 75.0
max = 100.0
rate_per_second = 4.0
seek_threshold = 55.0

[[foods]]
id = "close_snack"
nutrition = 8.0
[foods.position]
x = -1.5
y = 0.25
z = 0.5

[[foods]]
id = "balanced_meal"
nutrition = 20.0
[foods.position]
x = 2.0
y = 0.25
z = 1.0

[[foods]]
id = "rich_feast"
nutrition = 36.0
[foods.position]
x = 5.0
y = 0.25
z = -0.5
