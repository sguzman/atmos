# Showcase 1: one agent closes the hunger -> perceive -> choose -> walk -> eat loop.

[showcase]
name = "hungry_basic"
description = "One agent gets hungry, perceives food, selects a target, walks to it, eats it, and settles back to idle."

[world]
floor_size = 20.0
floor_color = "#2d3338"

[camera.position]
x = 0.0
y = 10.0
z = 13.0

[camera.look_at]
x = 0.0
y = 0.0
z = 0.0

[agent]
perception_radius = 12.0

[agent.position]
x = -4.0
y = 0.8
z = 0.0

[agent.motion]
speed = 2.5
consume_distance = 0.6

[agent.decision]
hunger_weight = 1.0
nutrition_weight = 1.0
distance_weight = 0.5

[agent.hunger]
initial = 52.0
max = 100.0
rate_per_second = 8.0
seek_threshold = 60.0

[[foods]]
id = "apple_a"
nutrition = 30.0
[foods.position]
x = 2.0
y = 0.25
z = -1.5

[[foods]]
id = "apple_b"
nutrition = 28.0
[foods.position]
x = -1.0
y = 0.25
z = 4.0
